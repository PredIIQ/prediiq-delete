<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PredIIQ - Predict Better. Win Different.</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta name="theme-color" content="#070b16">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      background: #070b16;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      padding: 20px;
    }

    .logo {
      width: 320px;
      max-width: 90%;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 60px);
      font-weight: 900;
      letter-spacing: -1px;
      margin: 10px 0;
    }

    .buttons {
      margin-top: 30px;
    }

    .btn {
      display: inline-block;
      margin: 10px;
      padding: 14px 22px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #000;
    }

    .btn.secondary {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
    }

    .links {
      margin-top: 25px;
    }

    .links a {
      color: #aeb7c8;
      margin: 0 10px;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="prediiq_logo.png" class="logo" alt="PredIIQ Logo">

    <h1>Predict Better. Win Different.</h1>

    <div class="buttons">
      <a href="#" class="btn">Download Android</a>
      <a href="#" class="btn secondary">Download iOS</a>
    </div>

    <div class="links">
      <a href="/privacy-policy/">Privacy Policy</a>
      <a href="/delete-account/">Delete Account</a>
    </div>
  </div>
</body>
</html>
