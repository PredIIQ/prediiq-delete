<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PredIIQ</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta name="theme-color" content="#070b16">

  <style>
    :root {
      --bg: #070b16;
      --green: #22c55e;
      --purple: #7c3aed;
      --text: #f8fafc;
      --muted: #aeb7c8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(124,58,237,0.2), transparent 40%),
        radial-gradient(circle at bottom, rgba(34,197,94,0.15), transparent 40%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      padding: 20px;
    }

    .logo {
      width: 520px;
      max-width: 95%;
      margin-bottom: 40px;
    }

    .buttons {
      margin-top: 10px;
    }

    .btn {
      display: inline-block;
      margin: 10px;
      padding: 16px 26px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 800;
      font-size: 16px;
      transition: 0.2s ease;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }

    .android {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #000;
    }

    .ios {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .btn:focus-visible {
      outline: 3px solid #f8fafc;
      outline-offset: 4px;
    }

    .links {
      margin-top: 30px;
    }

    .links a {
      color: var(--muted);
      margin: 0 12px;
      text-decoration: none;
      font-size: 14px;
      display: inline-block;
      padding: 5px 0;
    }

    .links a:hover {
      color: white;
    }

    @media (max-width: 600px) {
      .logo {
        width: 320px;
      }

      .btn {
        padding: 15px 22px;
        font-size: 15px;
        margin: 8px;
      }

      .links a {
        margin: 0 8px;
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- PREDIIQ LOGO -->
    <img
      src="prediiq_logo.png"
      class="logo"
      alt="PredIIQ Logo"
    >

    <!-- DOWNLOAD BUTTONS -->
    <div class="buttons">

      <!-- GOOGLE PLAY -->
      <a
        href="https://play.google.com/store/apps/details?id=com.prediiq.app"
        class="btn android"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Download PredIIQ on Google Play"
      >
        Download Android
      </a>

      <!-- APPLE APP STORE -->
      <a
        href="https://apps.apple.com/us/app/prediiq/id6765726510"
        class="btn ios"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Download PredIIQ on the Apple App Store"
      >
        Download iOS
      </a>

    </div>

    <!-- FOOTER LINKS -->
    <nav class="links" aria-label="Website links">
      <a href="/privacy-policy/">Privacy Policy</a>
      <a href="/delete-account/">Delete Account</a>
      <a href="/contact-us/">Contact Us</a>
    </nav>

  </main>

</body>
</html>
