<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PredIIQ</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta name="theme-color" content="#070b16">

  <style>
    :root {
      --bg: #070b16;
      --green: #22c55e;
      --purple: #7c3aed;
      --text: #f8fafc;
      --muted: #aeb7c8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      background:
        radial-gradient(circle at top, rgba(124,58,237,0.2), transparent 40%),
        radial-gradient(circle at bottom, rgba(34,197,94,0.15), transparent 40%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      padding: 20px;
    }

    .logo {
      width: 520px;
      max-width: 95%;
      margin-bottom: 40px;
    }

    .buttons {
      margin-top: 10px;
    }

    .btn {
      display: inline-block;
      margin: 10px;
      padding: 16px 26px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 800;
      font-size: 16px;
      transition: 0.2s ease;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }

    .android {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #000;
    }

    .ios {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .links {
      margin-top: 30px;
    }

    .links a {
      color: var(--muted);
      margin: 0 12px;
      text-decoration: none;
      font-size: 14px;
    }

    .links a:hover {
      color: white;
    }

    /* PREMIUM ANDROID COMING SOON MODAL */

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2, 6, 15, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 48px 32px 36px;
      text-align: center;
      border-radius: 28px;
      border: 1px solid rgba(34, 197, 94, 0.3);
      background:
        radial-gradient(
          circle at top,
          rgba(34, 197, 94, 0.18),
          transparent 65%
        ),
        linear-gradient(
          160deg,
          rgba(15, 23, 42, 0.98),
          rgba(7, 11, 22, 0.98)
        );
      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.5),
        0 0 45px rgba(34, 197, 94, 0.08);
      transform: translateY(25px) scale(0.96);
      transition: transform 0.35s ease;
    }

    .modal-overlay.active .modal {
      transform: translateY(0) scale(1);
    }

    .modal-close {
      position: absolute;
      top: 18px;
      right: 20px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 50%;
      background: rgba(148, 163, 184, 0.15);
      color: #cbd5e1;
      font-size: 24px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .modal-close:hover {
      background: rgba(148, 163, 184, 0.25);
      color: white;
    }

    .release-badge {
      display: inline-block;
      padding: 7px 16px;
      margin-bottom: 16px;
      border-radius: 100px;
      border: 1px solid rgba(34, 197, 94, 0.25);
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .modal h2 {
      margin: 0 0 14px;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1.5px;
      color: #f8fafc;
    }

    .modal-description {
      margin: 0;
      color: #aeb7c8;
      font-size: 15px;
      line-height: 1.8;
    }

    .modal-tagline {
      margin-top: 32px;
      color: #64748b;
      font-size: 12px;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      .logo {
        width: 320px;
      }

      .modal {
        padding: 48px 24px 32px;
      }

      .modal h2 {
        font-size: 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .modal-overlay,
      .modal,
      .btn {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGO ONLY (BIGGER) -->
    <img src="prediiq_logo.png" class="logo" alt="PredIIQ Logo">

    <!-- DOWNLOAD BUTTONS -->
    <div class="buttons">

      <button
        type="button"
        class="btn android"
        onclick="openAndroidModal()"
      >
        Download Android
      </button>

      <a
        href="https://apps.apple.com/us/app/prediiq/id6765726510"
        class="btn ios"
        target="_blank"
        rel="noopener noreferrer"
      >
        Download iOS
      </a>

    </div>

    <!-- LINKS -->
    <div class="links">
      <a href="/privacy-policy/">Privacy Policy</a>
      <a href="/delete-account/">Delete Account</a>
      <a href="/contact-us/">Contact Us</a>
    </div>

  </div>

  <!-- PREMIUM ANDROID COMING SOON POPUP -->
  <div
    id="androidModal"
    class="modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="androidModalTitle"
    aria-hidden="true"
    onclick="closeAndroidModal(event)"
  >

    <div class="modal">

      <button
        type="button"
        class="modal-close"
        aria-label="Close"
        onclick="closeAndroidModal()"
      >
        &times;
      </button>

      <div class="release-badge">
        ANDROID RELEASE
      </div>

      <h2 id="androidModalTitle">
        Coming Soon
      </h2>

      <p class="modal-description">
        PredIIQ for Android is on its way. Stay tuned
        for the official Google Play launch.
      </p>

      <div class="modal-tagline">
        PREDIIQ · PREDICT BETTER. WIN DIFFERENT.
      </div>

    </div>

  </div>

  <script>
    const androidModal = document.getElementById("androidModal");
    const androidCloseButton = androidModal.querySelector(".modal-close");

    let previousFocus = null;

    function openAndroidModal() {
      previousFocus = document.activeElement;
      androidModal.classList.add("active");
      androidModal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      androidCloseButton.focus();
    }

    function closeAndroidModal(event) {
      if (event && event.target !== androidModal) {
        return;
      }

      androidModal.classList.remove("active");
      androidModal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";

      if (previousFocus) {
        previousFocus.focus();
      }
    }

    document.addEventListener("keydown", function(event) {
      if (!androidModal.classList.contains("active")) {
        return;
      }

      if (event.key === "Escape") {
        closeAndroidModal();
      }

      if (event.key === "Tab") {
        event.preventDefault();
        androidCloseButton.focus();
      }
    });
  </script>

</body>
</html>
