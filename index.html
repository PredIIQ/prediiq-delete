<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PredIIQ - Predict Better. Win Different.</title>

  <style>
    :root {
      --bg: #060914;
      --card: rgba(16, 24, 39, 0.82);
      --green: #22c55e;
      --purple: #a855f7;
      --gold: #facc15;
      --text: #f8fafc;
      --muted: #aeb7c8;
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top center, rgba(168, 85, 247, 0.28), transparent 34%),
        radial-gradient(circle at bottom center, rgba(34, 197, 94, 0.14), transparent 35%),
        linear-gradient(135deg, #050816 0%, #0b1020 50%, #020617 100%);
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
      position: relative;
    }

    .glow {
      position: absolute;
      width: 420px;
      height: 420px;
      background: rgba(168, 85, 247, 0.22);
      filter: blur(90px);
      border-radius: 50%;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 920px;
      padding: 54px 28px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 34px;
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(14px);
    }

    .logo {
      width: min(620px, 92%);
      height: auto;
      display: block;
      margin: 0 auto 18px;
      filter: drop-shadow(0 22px 45px rgba(168, 85, 247, 0.35));
    }

    h1 {
      margin: 10px 0 8px;
      font-size: clamp(34px, 6vw, 68px);
      line-height: 1;
      letter-spacing: -1.8px;
    }

    .tagline {
      margin: 0 auto;
      max-width: 680px;
      color: var(--muted);
      font-size: clamp(17px, 2.4vw, 22px);
      line-height: 1.6;
    }

    .download-title {
      margin-top: 34px;
      margin-bottom: 16px;
      font-size: 18px;
      color: #dbe4f0;
      font-weight: 700;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .store-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 210px;
      padding: 16px 20px;
      border-radius: 18px;
      text-decoration: none;
      font-weight: 800;
      color: #06110a;
      background: linear-gradient(135deg, var(--green), #16a34a);
      box-shadow: 0 16px 34px rgba(34, 197, 94, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .store-btn.secondary {
      color: white;
      background: linear-gradient(135deg, #7c3aed, var(--purple));
      box-shadow: 0 16px 34px rgba(168, 85, 247, 0.25);
    }

    .store-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 22px 46px rgba(34, 197, 94, 0.32);
    }

    .store-btn.secondary:hover {
      box-shadow: 0 22px 46px rgba(168, 85, 247, 0.32);
    }

    .small {
      margin-top: 26px;
      color: var(--muted);
      font-size: 14px;
    }

    .links {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 14px;
    }

    .links a {
      color: #cbd5e1;
      text-decoration: none;
    }

    .links a:hover {
      color: var(--green);
    }

    @media (max-width: 600px) {
      .card {
        padding: 38px 18px;
        border-radius: 26px;
      }

      .store-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="glow"></div>

    <section class="card">
      <img src="prediiq_logo.png" class="logo" alt="PredIIQ Logo">

      <h1>Coming Soon</h1>

      <p class="tagline">
        PredIIQ is your smart football prediction companion. Live picks, match insight, and premium analysis in one app.
      </p>

      <div class="download-title">
        Download the app
      </div>

      <div class="buttons">
        <a class="store-btn" href="#" target="_blank" rel="noopener">
          Android App
        </a>

        <a class="store-btn secondary" href="#" target="_blank" rel="noopener">
          iOS App
        </a>
      </div>

      <p class="small">
        App Store and Google Play links will be added once the app is published.
      </p>

      <div class="links">
        <a href="/privacy-policy/">Privacy Policy</a>
        <a href="/delete-account/">Delete Account</a>
        <a href="mailto:tech@prediiq.com">Contact Support</a>
      </div>
    </section>
  </main>
</body>
</html>
